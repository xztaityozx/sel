name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/benchmark.yml'
      - '.github/benchmark.sh'

permissions:
  contents: read

jobs:
  hyperfine:
    name: "Compare with base branch"
    runs-on: ubuntu-latest
    env:
      # head の median が base の median のこの倍率を超えたら失敗させる。
      # 同一コードでの実測ではケースあたりのブレは 1〜3% なので、10% あれば誤検知しない
      THRESHOLD: "1.10"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ^1.26
      - uses: jdx/mise-action@v5.1.2

      # 比較の公平さのため、head も base も同じコマンドでビルドする (Makefile は使わない)
      - name: Build head
        run: go build -o /tmp/sel-head .
      - name: Build base
        run: |
          git worktree add /tmp/base ${{ github.event.pull_request.base.sha }}
          go build -C /tmp/base -o /tmp/sel-base .

      - name: Generate input
        run: |
          awk 'BEGIN{for(i=0;i<200000;i++){for(c=1;c<=20;c++){printf "col%d_%07d%s", c, i, (c==20?"\n":" ")}}}' > /tmp/data.txt
          tr ' ' ',' < /tmp/data.txt > /tmp/data.csv

      - name: Benchmark
        run: .github/benchmark.sh
